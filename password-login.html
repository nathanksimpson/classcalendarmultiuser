<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign in with password — ClassManager</title>
    <script src="js/theme-init.js"></script>
    <script src="js/language-init.js"></script>
    <link rel="stylesheet" href="styles.css?v=20260629-classmanager-redesign">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-main);
            color: var(--text-primary);
        }
        .login-theme-bar {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 10;
            padding: 0.75rem 1rem;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
        }
        .login-card h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
        .login-card p { margin: 0 0 1.25rem; color: var(--text-muted); font-size: 0.95rem; }
        .login-back {
            margin: 0 0 1rem;
            font-size: 0.88rem;
        }
        .login-back a { color: var(--text-secondary); }
        .login-back a:hover { color: var(--text-primary); }
        .login-device {
            margin: 0 0 1.25rem;
            padding: 0;
            border: none;
        }
        .login-device legend {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            padding: 0;
        }
        .login-device label {
            display: block;
            margin-bottom: 0.5rem;
            padding: 0.65rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.35;
        }
        .login-device label:has(input:checked) {
            border-color: var(--accent, #3b82f6);
            background: var(--bg-subtle, rgba(59, 130, 246, 0.08));
            color: var(--text-primary);
        }
        .login-device input { margin-right: 0.5rem; vertical-align: middle; }
        .login-device strong {
            display: block;
            color: var(--text-primary);
            font-size: 0.92rem;
            margin-bottom: 0.15rem;
        }
        .login-form label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            margin-bottom: 0.75rem;
            padding: 0.5rem 0.65rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-primary);
            box-sizing: border-box;
        }
        .login-error {
            color: var(--status-error-color);
            font-size: 0.9rem;
            margin-top: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="login-theme-bar">
        <button type="button" id="loginLangToggle" class="btn btn-outline btn-small btn-lang" style="margin-right: 0.5rem;">🌐 한국어</button>
        <button type="button" id="loginThemeToggle" class="btn btn-outline btn-small btn-header-theme" aria-pressed="false">🌙 Dark</button>
    </div>
    <div class="login-page">
        <div class="login-card">
            <p class="login-back"><a id="backToChooserLink" href="/login.html">← Back to sign-in options</a></p>
            <h1 id="loginTitle">ClassManager — Team</h1>
            <p id="loginLead">Sign in with the email and password your admin gave you.</p>

            <form id="loginForm" class="login-form" method="post" action="/password-login.html" autocomplete="on">
                <label for="username" id="loginEmailLabel">Email</label>
                <input type="text" id="username" name="username" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                <label for="password" id="loginPasswordLabel">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                <input type="hidden" name="return" id="passwordReturn" value="/">
                <input type="hidden" name="device" id="passwordDevice" value="personal">
                <button type="submit" class="btn btn-primary" style="width: 100%;" id="passwordSignInBtn">Sign in</button>
            </form>
            <p id="loginError" class="login-error" style="display: none;"></p>
        </div>
    </div>
    <script>
        (function () {
            const COPY = {
                en: {
                    langToggle: '🌐 한국어',
                    title: 'ClassManager — Team',
                    lead: 'Sign in with the email and password your admin gave you.',
                    backToChooser: '← Back to sign-in options',
                    deviceLegend: 'Where are you signing in?',
                    devicePersonalTitle: 'My computer',
                    devicePersonalHint: 'Stay signed in longer (up to your school’s limit).',
                    deviceSharedTitle: 'Shared or public computer',
                    deviceSharedHint: 'Shorter sign-in (1 day max). Auto sign-out after 15 minutes idle.',
                    email: 'Email',
                    password: 'Password',
                    signIn: 'Sign in',
                    invalid_password: 'Invalid email or password.',
                    password_not_set: 'No password is set for this account. Ask an admin or use Kakao sign-in.',
                    sign_in_failed: 'Sign-in failed. Try again.'
                },
                ko: {
                    langToggle: '🌐 English',
                    title: 'ClassManager — 팀',
                    lead: '관리자가 알려준 이메일과 비밀번호로 로그인하세요.',
                    backToChooser: '← 로그인 방법 선택으로 돌아가기',
                    deviceLegend: '어떤 기기에서 로그인하나요?',
                    devicePersonalTitle: '내 컴퓨터',
                    devicePersonalHint: '로그인 유지가 더 길게 됩니다(학교 설정 한도 내).',
                    deviceSharedTitle: '공용/다른 사람과 함께 쓰는 컴퓨터',
                    deviceSharedHint: '짧게 로그인합니다(최대 1일). 15분 미사용 시 자동 로그아웃됩니다.',
                    email: '이메일',
                    password: '비밀번호',
                    signIn: '로그인',
                    invalid_password: '이메일 또는 비밀번호가 올바르지 않습니다.',
                    password_not_set: '비밀번호가 설정되지 않았습니다. 관리자에게 문의하거나 카카오 로그인을 사용하세요.',
                    sign_in_failed: '로그인에 실패했습니다. 다시 시도해 주세요.'
                }
            };

            function getLang() {
                try {
                    if (typeof CCPLanguage !== 'undefined' && CCPLanguage.resolveCalendarLanguage) {
                        return CCPLanguage.resolveCalendarLanguage();
                    }
                    const saved = localStorage.getItem('calendarLanguage');
                    return saved === 'ko' ? 'ko' : 'en';
                } catch (_) {
                    return 'en';
                }
            }

            function t(key) {
                const lang = getLang();
                return (COPY[lang] && COPY[lang][key]) || COPY.en[key] || key;
            }

            function clientAgentLog(location, message, data, hypothesisId) {
                fetch('/api/debug/agent-log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        location: location,
                        message: message,
                        data: data || {},
                        hypothesisId: hypothesisId || 'H9'
                    })
                }).catch(function () {});
            }

            function applyLang() {
                document.documentElement.lang = getLang() === 'ko' ? 'ko' : 'en';
                [
                    ['loginTitle', 'title'],
                    ['loginLead', 'lead'],
                    ['backToChooserLink', 'backToChooser'],
                    ['loginEmailLabel', 'email'],
                    ['loginPasswordLabel', 'password'],
                    ['passwordSignInBtn', 'signIn']
                ].forEach(function (pair) {
                    const el = document.getElementById(pair[0]);
                    if (el) el.textContent = t(pair[1]);
                });
                const langBtn = document.getElementById('loginLangToggle');
                if (langBtn) langBtn.textContent = t('langToggle');
            }

            applyLang();

            const params = new URLSearchParams(location.search);
            const safeReturn = (function () {
                const r = params.get('return') || '/';
                return r.startsWith('/') && !r.startsWith('//') ? r : '/';
            })();
            const passwordReturn = document.getElementById('passwordReturn');
            if (passwordReturn) passwordReturn.value = safeReturn;
            const backLink = document.getElementById('backToChooserLink');
            if (backLink) {
                backLink.href = '/login.html?return=' + encodeURIComponent(safeReturn);
            }

            const DEVICE_STORAGE_KEY = 'calendarLoginDevice';
            function syncLoginDeviceToForms() {
                let device = 'personal';
                try {
                    const saved = localStorage.getItem(DEVICE_STORAGE_KEY);
                    if (saved === 'shared' || saved === 'personal') {
                        device = saved;
                    }
                } catch (_) { /* ignore */ }
                const passwordDevice = document.getElementById('passwordDevice');
                if (passwordDevice) passwordDevice.value = device;
                return device;
            }
            syncLoginDeviceToForms();

            const err = params.get('error');
            if (err) {
                const el = document.getElementById('loginError');
                if (el) {
                    el.style.display = 'block';
                    el.textContent = t(err) || err;
                }
            }

            const form = document.getElementById('loginForm');
            if (form) {
                function tryAutofillCredentials(trigger) {
                    if (!navigator.credentials || !navigator.credentials.get) {
                        return;
                    }
                    navigator.credentials
                        .get({ password: true, mediation: 'optional' })
                        .then(function (cred) {
                            if (!cred) {
                                clientAgentLog('password-login.html:autofill', 'credentials.get empty', {
                                    trigger: trigger
                                }, 'H11');
                                return;
                            }
                            const userEl = document.getElementById('username');
                            const passEl = document.getElementById('password');
                            if (userEl && cred.id) userEl.value = cred.id;
                            if (passEl && cred.password) passEl.value = cred.password;
                            clientAgentLog('password-login.html:autofill', 'credentials.get filled', {
                                trigger: trigger,
                                hasId: Boolean(cred && cred.id)
                            }, 'H11');
                        })
                        .catch(function (err) {
                            clientAgentLog('password-login.html:autofill', 'credentials.get failed', {
                                trigger: trigger,
                                error: String(err && err.message ? err.message : err)
                            }, 'H11');
                        });
                }

                const usernameInput = document.getElementById('username');
                if (usernameInput) {
                    usernameInput.addEventListener(
                        'focus',
                        function () {
                            tryAutofillCredentials('focus');
                        },
                        { once: true }
                    );
                }

                // #region agent log
                clientAgentLog('password-login.html:form', 'dedicated password page loaded', {
                    action: form.getAttribute('action'),
                    usernameName: 'username',
                    pageUrl: location.pathname,
                    hasPasswordCredentialApi: Boolean(
                        window.PasswordCredential &&
                            navigator.credentials &&
                            navigator.credentials.store
                    )
                }, 'H9');
                // #endregion
                form.addEventListener('submit', function (e) {
                    syncLoginDeviceToForms();
                    const submitBtn = form.querySelector('button[type="submit"]');
                    const username = String(document.getElementById('username')?.value || '').trim();
                    const password = String(document.getElementById('password')?.value || '');
                    const returnDest = String(document.getElementById('passwordReturn')?.value || '/');
                    const device = String(document.getElementById('passwordDevice')?.value || 'personal');
                    const canStore = Boolean(
                        window.PasswordCredential &&
                            navigator.credentials &&
                            navigator.credentials.store
                    );
                    if (!canStore) {
                        clientAgentLog('password-login.html:submit', 'native form submit fallback', {
                            action: form.getAttribute('action')
                        }, 'H10');
                        if (submitBtn) submitBtn.disabled = true;
                        return;
                    }
                    e.preventDefault();
                    if (submitBtn) submitBtn.disabled = true;
                    clientAgentLog('password-login.html:submit', 'credstore path start', {
                        hasUsername: Boolean(username),
                        hasPassword: Boolean(password)
                    }, 'H10');
                    fetch('/api/auth/password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'same-origin',
                        body: JSON.stringify({
                            email: username,
                            username: username,
                            password: password,
                            return: returnDest,
                            device: device
                        })
                    })
                        .then(function (res) {
                            return res
                                .json()
                                .catch(function () {
                                    return {};
                                })
                                .then(function (body) {
                                    return { ok: res.ok, status: res.status, body: body };
                                });
                        })
                        .then(function (result) {
                            if (!result.ok) {
                                const msg =
                                    (result.body && result.body.error) || t('invalid_password');
                                const el = document.getElementById('loginError');
                                if (el) {
                                    el.style.display = 'block';
                                    el.textContent = msg;
                                }
                                if (submitBtn) submitBtn.disabled = false;
                                clientAgentLog('password-login.html:submit', 'credstore login failed', {
                                    status: result.status
                                }, 'H10');
                                return;
                            }
                            return navigator.credentials
                                .store(
                                    new PasswordCredential({
                                        id: username,
                                        password: password,
                                        name: username
                                    })
                                )
                                .then(function () {
                                    clientAgentLog('password-login.html:submit', 'credentials.store ok', {}, 'H10');
                                    const lead = document.getElementById('loginLead');
                                    if (lead) {
                                        lead.textContent =
                                            getLang() === 'ko'
                                                ? '로그인되었습니다. 이 브라우저에 비밀번호가 저장되었습니다.'
                                                : 'Signed in. Password saved in this browser.';
                                    }
                                })
                                .catch(function (storeErr) {
                                    clientAgentLog('password-login.html:submit', 'credentials.store failed', {
                                        error: String(
                                            storeErr && storeErr.message ? storeErr.message : storeErr
                                        )
                                    }, 'H10');
                                })
                                .then(function () {
                                    location.href = returnDest;
                                });
                        })
                        .catch(function () {
                            const el = document.getElementById('loginError');
                            if (el) {
                                el.style.display = 'block';
                                el.textContent = t('sign_in_failed');
                            }
                            if (submitBtn) submitBtn.disabled = false;
                            clientAgentLog('password-login.html:submit', 'credstore fetch error', {}, 'H10');
                        });
                });
            }

            document.getElementById('loginLangToggle')?.addEventListener('click', function () {
                const next = getLang() === 'ko' ? 'en' : 'ko';
                try { localStorage.setItem('calendarLanguage', next); } catch (_) { /* ignore */ }
                applyLang();
            });
        })();
    </script>
</body>
</html>
