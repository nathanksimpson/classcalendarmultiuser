name = "class-calendar-team"
main = "worker/src/index.js"
compatibility_date = "2024-09-01"

# Static site: connect this repo root as Cloudflare Pages project.
# Route /api/* to this Worker (Workers & Pages → your project → Settings → Functions).

[[d1_databases]]
binding = "DB"
database_name = "calendar-team"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[vars]
PUBLIC_URL = "https://your-calendar.pages.dev"

# Secrets (wrangler secret put):
# KAKAO_CLIENT_ID
# KAKAO_CLIENT_SECRET
# BOOTSTRAP_ADMIN_SECRET
