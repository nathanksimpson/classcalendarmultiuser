name = "classcalendarmultiuser"
main = "worker/src/index.js"
compatibility_date = "2024-09-01"

# Serves index.html, app.js, etc. API routes are handled in worker/src/index.js.
[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1: calendar-team (Cloudflare dashboard)
[[d1_databases]]
binding = "DB"
database_name = "calendar-team"
database_id = "002a1ed6-f90b-425e-a4a7-518d07c4040d"
migrations_dir = "worker/migrations"

[vars]
# Set to your live URL after the first deploy (Workers *.workers.dev or custom domain).
PUBLIC_URL = "https://classcalendarmultiuser.workers.dev"

# Secrets (wrangler secret put):
# KAKAO_CLIENT_ID
# KAKAO_CLIENT_SECRET
# BOOTSTRAP_ADMIN_SECRET
