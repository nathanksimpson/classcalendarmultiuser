name = "classcalendarmultiuser"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Run before deploy (local `npm run deploy` and Cloudflare Workers Builds on git push).
# dist/ is gitignored; without this, CI fails: assets.directory "dist" does not exist.
[build]
command = "npm run build"

# Serves index.html, app.js, etc. API routes are handled in worker/src/index.js.
# run_worker_first: without this, POST to *.html / SPA paths returns 405 from the
# assets layer and never reaches password-login handlers in the Worker.
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
    "/api/*",
    "/admin",
    "/admin/",
    "/admin.html",
    "/login",
    "/login.html",
    "/password-login",
    "/password-login.html",
    "/kakao-login.html",
    "/signed-in.html"
]

# D1: calendar-team (Cloudflare dashboard)
[[d1_databases]]
binding = "DB"
database_name = "calendar-team"
database_id = "002a1ed6-f90b-425e-a4a7-518d07c4040d"
migrations_dir = "worker/migrations"

# Route traffic on existing proxied DNS (apex + www). Custom domains failed with
# error 100117 because manual A/CNAME records already exist on the zone.
[[routes]]
pattern = "classmanager.live/*"
zone_name = "classmanager.live"

[[routes]]
pattern = "www.classmanager.live/*"
zone_name = "classmanager.live"

[ai]
binding = "AI"

# Daily D1 cleanup (scheduled() in worker/src/index.js): rate buckets, expired sessions, old presence.
[triggers]
crons = ["17 19 * * *"]   # 04:17 KST

[vars]
PUBLIC_URL = "https://classmanager.live"

# Secrets (wrangler secret put):
# KAKAO_CLIENT_ID
# KAKAO_CLIENT_SECRET
# BOOTSTRAP_ADMIN_SECRET
# (TMS sync uses per-request credentials from the Sync modal — not wrangler secrets)
