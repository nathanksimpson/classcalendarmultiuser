<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kakao sign in — ClassManager</title>
    <script src="js/theme-init.js"></script>
    <script src="js/language-init.js"></script>
    <link rel="stylesheet" href="styles.css?v=20260629-classmanager-redesign">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--bg-main); color: var(--text-primary); }
        .login-theme-bar { position: fixed; top: 0; right: 0; z-index: 10; padding: 0.75rem 1rem; }
        .login-card { max-width: 420px; width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 2rem; box-shadow: var(--shadow-lg); }
        .login-card h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
        .login-card p { margin: 0 0 1.25rem; color: var(--text-muted); font-size: 0.95rem; }
        .login-back { margin: 0 0 1rem; font-size: 0.88rem; }
        .login-back a { color: var(--text-secondary); text-decoration: none; }
        .login-back a:hover { color: var(--text-primary); }
        .login-kakao { display: block; width: 100%; padding: 0.85rem 1rem; border: none; border-radius: 8px; background: #fee500; color: #191600; font-weight: 600; font-size: 1rem; cursor: pointer; text-align: center; text-decoration: none; box-sizing: border-box; }
        .login-kakao:hover { filter: brightness(0.97); }
        .login-kakao.is-disabled { opacity: 0.55; cursor: not-allowed; pointer-events: none; }
        .login-kakao-hint { margin: 0.75rem 0 0; font-size: 0.82rem; color: var(--text-muted); line-height: 1.4; }
        .login-kakao-switch { margin: 0.65rem 0 0; font-size: 0.88rem; text-align: center; }
        .login-kakao-switch a { color: var(--text-secondary); }
        .login-device { margin: 0 0 1.25rem; padding: 0; border: none; }
        .login-device legend { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; padding: 0; }
        .login-device label { display: block; margin-bottom: 0.5rem; padding: 0.65rem 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-size: 0.88rem; color: var(--text-secondary); line-height: 1.35; }
        .login-device label:has(input:checked) { border-color: var(--accent, #3b82f6); background: var(--bg-subtle, rgba(59, 130, 246, 0.08)); color: var(--text-primary); }
        .login-device input { margin-right: 0.5rem; vertical-align: middle; }
        .login-device strong { display: block; color: var(--text-primary); font-size: 0.92rem; margin-bottom: 0.15rem; }
        .login-notes-entry { margin: 1rem 0 0; text-align: center; }
        .login-notes-link { display: inline-block; width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-primary); font-weight: 600; font-size: 0.95rem; text-decoration: none; box-sizing: border-box; }
        .login-notes-link:hover { border-color: var(--primary); color: var(--primary); }
        .login-error { color: var(--status-error-color); font-size: 0.9rem; margin-top: 0.75rem; }
    </style>
</head>
<body>
    <div id="appNoticeRail" class="app-notice-rail" role="status" aria-live="polite" aria-hidden="true"></div>
    <div class="login-theme-bar">
        <button type="button" id="loginLangToggle" class="btn btn-outline btn-small btn-lang" style="margin-right: 0.5rem;">🌐 한국어</button>
        <button type="button" id="loginThemeToggle" class="btn btn-outline btn-small btn-header-theme" aria-pressed="false">🌙 Dark</button>
    </div>
    <div class="login-page">
        <div class="login-card">
            <p class="login-back"><a id="backToChooserLink" href="/login.html">← Back to sign-in options</a></p>
            <h1 id="loginTitle">ClassManager — Team</h1>
            <p id="loginLead">Sign in with your school Kakao account. First-time sign-in creates your account automatically.</p>

            <fieldset class="login-device" id="loginDeviceFieldset">
                <legend id="loginDeviceLegend">Where are you signing in?</legend>
                <label>
                    <input type="radio" name="loginDevice" value="personal" checked autocomplete="off">
                    <strong id="loginDevicePersonalTitle">My computer</strong>
                    <span id="loginDevicePersonalHint">Stay signed in longer (up to your school’s limit).</span>
                </label>
                <label>
                    <input type="radio" name="loginDevice" value="shared" autocomplete="off">
                    <strong id="loginDeviceSharedTitle">Shared or public computer</strong>
                    <span id="loginDeviceSharedHint">Shorter sign-in (1 day max). Auto sign-out after 15 minutes idle.</span>
                </label>
            </fieldset>

            <a id="kakaoLoginBtn" class="login-kakao" href="/api/auth/kakao">Login with Kakao</a>
            <p class="login-kakao-switch">
                <a id="kakaoSwitchAccount" href="/api/auth/kakao?prompt=login">Use a different Kakao account</a>
            </p>
            <p id="kakaoConfigHint" class="login-kakao-hint" style="display: none;"></p>
            <p id="loginError" class="login-error" style="display: none;"></p>

            <p class="login-notes-entry">
                <a id="loginNotesLink" class="login-notes-link" href="/login.html?return=/notes.html">Class day notes (mobile)</a>
            </p>
        </div>
    </div>
    <script src="js/page-chrome.js?v=20260619-viewport-tier"></script>
    <script>
        (function () {
            const COPY = {
                en: {
                    langToggle: '🌐 한국어',
                    title: 'ClassManager — Team',
                    lead: 'Sign in with your school Kakao account. First-time sign-in creates your account automatically.',
                    backToChooser: '← Back to sign-in options',
                    deviceLegend: 'Where are you signing in?',
                    devicePersonalTitle: 'My computer',
                    devicePersonalHint: 'Stay signed in longer (up to your school’s limit).',
                    deviceSharedTitle: 'Shared or public computer',
                    deviceSharedHint: 'Shorter sign-in (1 day max). Auto sign-out after 15 minutes idle.',
                    kakaoLogin: 'Login with Kakao',
                    kakaoSwitch: 'Use a different Kakao account',
                    kakaoNotConfigured: 'Kakao login is not configured. Go back and use email & password instead.',
                    notesEntryLink: 'Class day notes (mobile)',
                    idleSignedOut: 'You were signed out due to inactivity. Sign in again to continue.',
                    oauth_failed: 'Kakao sign-in failed. Try again or ask your calendar admin.',
                    oauth_denied: 'Kakao sign-in was cancelled.',
                    oauth_code_expired: 'Kakao sign-in timed out. Click Login with Kakao again.',
                    oauth_state_invalid: 'Sign-in session expired. Click Login with Kakao again.',
                    missing_code: 'Kakao did not return a sign-in code. Try again.',
                    account_disabled: 'This account has been deactivated. Contact your calendar admin.',
                    not_invited: 'You are not on the teacher list yet. Ask your admin to add you in Admin.',
                    kakao_not_linked: 'Kakao is not linked yet. Ask your admin to add your Kakao user ID.',
                    kakao_mismatch: 'This Kakao account does not match the ID on file. Contact your admin.'
                },
                ko: {
                    langToggle: '🌐 English',
                    title: 'ClassManager — 팀',
                    lead: '학교 카카오 계정으로 로그인하세요. 처음 로그인하면 계정이 자동으로 만들어집니다.',
                    backToChooser: '← 로그인 방법 선택으로 돌아가기',
                    deviceLegend: '어떤 기기에서 로그인하나요?',
                    devicePersonalTitle: '내 컴퓨터',
                    devicePersonalHint: '로그인 유지가 더 길게 됩니다(학교 설정 한도 내).',
                    deviceSharedTitle: '공용/다른 사람과 함께 쓰는 컴퓨터',
                    deviceSharedHint: '짧게 로그인합니다(최대 1일). 15분 미사용 시 자동 로그아웃됩니다.',
                    kakaoLogin: '카카오로 로그인',
                    kakaoSwitch: '다른 카카오 계정으로 로그인',
                    kakaoNotConfigured: '카카오 로그인이 설정되지 않았습니다. 돌아가서 이메일·비밀번호를 사용하세요.',
                    notesEntryLink: '수업 일지 (모바일)',
                    idleSignedOut: '오래 활동이 없어 자동 로그아웃되었습니다. 다시 로그인해 주세요.',
                    oauth_failed: '카카오 로그인에 실패했습니다. 다시 시도하거나 관리자에게 문의하세요.',
                    oauth_denied: '카카오 로그인이 취소되었습니다.',
                    oauth_code_expired: '카카오 로그인 시간이 만료되었습니다. 다시 로그인 버튼을 눌러 주세요.',
                    oauth_state_invalid: '로그인 세션이 만료되었습니다. 다시 로그인해 주세요.',
                    missing_code: '카카오가 로그인 코드를 반환하지 않았습니다.',
                    account_disabled: '이 계정은 비활성화되었습니다.',
                    not_invited: '아직 선생님 목록에 등록되어 있지 않습니다.',
                    kakao_not_linked: '카카오 계정이 아직 연결되지 않았습니다.',
                    kakao_mismatch: '이 카카오 계정은 등록된 ID와 일치하지 않습니다.'
                }
            };

            function getLang() {
                try {
                    if (typeof CCPLanguage !== 'undefined' && CCPLanguage.resolveCalendarLanguage) {
                        return CCPLanguage.resolveCalendarLanguage();
                    }
                    const saved = localStorage.getItem('calendarLanguage');
                    return saved === 'ko' ? 'ko' : 'en';
                } catch (_) { return 'en'; }
            }
            function t(key) {
                const lang = getLang();
                return (COPY[lang] && COPY[lang][key]) || COPY.en[key] || key;
            }
            function applyLang() {
                document.documentElement.lang = getLang() === 'ko' ? 'ko' : 'en';
                [
                    ['loginTitle', 'title'], ['loginLead', 'lead'], ['backToChooserLink', 'backToChooser'],
                    ['loginDeviceLegend', 'deviceLegend'], ['loginDevicePersonalTitle', 'devicePersonalTitle'],
                    ['loginDevicePersonalHint', 'devicePersonalHint'], ['loginDeviceSharedTitle', 'deviceSharedTitle'],
                    ['loginDeviceSharedHint', 'deviceSharedHint'], ['loginNotesLink', 'notesEntryLink']
                ].forEach(function (pair) {
                    const el = document.getElementById(pair[0]);
                    if (el) el.textContent = t(pair[1]);
                });
                const kakaoBtn = document.getElementById('kakaoLoginBtn');
                if (kakaoBtn) kakaoBtn.textContent = t('kakaoLogin');
                const kakaoSwitch = document.getElementById('kakaoSwitchAccount');
                if (kakaoSwitch) kakaoSwitch.textContent = t('kakaoSwitch');
                const langBtn = document.getElementById('loginLangToggle');
                if (langBtn) langBtn.textContent = t('langToggle');
            }
            applyLang();
            document.getElementById('loginLangToggle')?.addEventListener('click', function () {
                try { localStorage.setItem('calendarLanguage', getLang() === 'ko' ? 'en' : 'ko'); } catch (_) {}
                applyLang();
            });

            const params = new URLSearchParams(location.search);
            const safeReturn = (function () {
                const r = params.get('return') || '/';
                return r.startsWith('/') && !r.startsWith('//') ? r : '/';
            })();
            function pageQuery() {
                const q = new URLSearchParams();
                if (safeReturn !== '/') q.set('return', safeReturn);
                if (params.get('error')) q.set('error', params.get('error'));
                if (params.get('signedOut')) q.set('signedOut', params.get('signedOut'));
                const qs = q.toString();
                return qs ? '?' + qs : '';
            }
            const backLink = document.getElementById('backToChooserLink');
            if (backLink) backLink.href = '/login.html' + pageQuery();
            const notesLink = document.getElementById('loginNotesLink');
            if (notesLink) notesLink.href = '/login.html?return=' + encodeURIComponent('/notes.html');

            const DEVICE_STORAGE_KEY = 'calendarLoginDevice';
            function getSelectedLoginDevice() {
                const picked = document.querySelector('input[name="loginDevice"]:checked');
                return picked && picked.value === 'shared' ? 'shared' : 'personal';
            }
            function syncDevice() {
                const device = getSelectedLoginDevice();
                try { localStorage.setItem(DEVICE_STORAGE_KEY, device); } catch (_) {}
                return device;
            }
            try {
                const saved = localStorage.getItem(DEVICE_STORAGE_KEY);
                if (saved === 'shared' || saved === 'personal') {
                    const input = document.querySelector('input[name="loginDevice"][value="' + saved + '"]');
                    if (input) input.checked = true;
                }
            } catch (_) {}
            function kakaoAuthQuery(extra) {
                const device = syncDevice();
                const parts = ['return=' + encodeURIComponent(safeReturn), 'device=' + encodeURIComponent(device)];
                if (extra) parts.push(extra);
                return parts.join('&');
            }
            function updateKakaoLinks() {
                const kakaoBtn = document.getElementById('kakaoLoginBtn');
                const kakaoSwitch = document.getElementById('kakaoSwitchAccount');
                if (kakaoBtn) kakaoBtn.href = '/api/auth/kakao?' + kakaoAuthQuery();
                if (kakaoSwitch) kakaoSwitch.href = '/api/auth/kakao?' + kakaoAuthQuery('prompt=login');
            }
            updateKakaoLinks();
            document.querySelectorAll('input[name="loginDevice"]').forEach(function (input) {
                input.addEventListener('change', updateKakaoLinks);
            });

            if (params.get('signedOut') === 'idle') {
                const el = document.getElementById('loginError');
                if (el) { el.style.display = 'block'; el.textContent = t('idleSignedOut'); }
            }
            const err = params.get('error');
            if (err) {
                const el = document.getElementById('loginError');
                if (el) { el.style.display = 'block'; el.textContent = t(err) || err; }
            }

            fetch('/api/health', { credentials: 'same-origin' })
                .then(function (r) { return r.ok ? r.json() : {}; })
                .then(function (h) {
                    if (h && h.kakaoConfigured === false) {
                        const kakaoBtn = document.getElementById('kakaoLoginBtn');
                        if (kakaoBtn) { kakaoBtn.classList.add('is-disabled'); kakaoBtn.setAttribute('aria-disabled', 'true'); }
                        const hint = document.getElementById('kakaoConfigHint');
                        if (hint) { hint.style.display = 'block'; hint.textContent = t('kakaoNotConfigured'); }
                    }
                })
                .catch(function () {});
        })();
    </script>
</body>
</html>
