<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <base href="/">
    <title>Schedule planner — ClassManager</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script src="js/theme-init.js"></script>
    <script src="js/language-init.js"></script>
    <script>
        window.CCP_I18N_VERSION = '20261114-planner-theme';
        (function () {
            try {
                var lang = (window.CCPLanguage && window.CCPLanguage.resolveCalendarLanguage)
                    ? window.CCPLanguage.resolveCalendarLanguage()
                    : 'en';
                if (lang === 'ko') {
                    document.write(
                        '<scr' + 'ipt defer src="js/i18n/calendar-ko.js?v='
                        + window.CCP_I18N_VERSION + '"></scr' + 'ipt>'
                    );
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20261114-planner-theme">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="planner-page">
    <div id="appNoticeRail" class="app-notice-rail" role="status" aria-live="polite" aria-hidden="true"></div>
    <div id="viewAsBanner" class="view-as-banner" hidden role="status" aria-live="polite">
        <div class="view-as-banner-inner">
            <div class="view-as-banner-text">
                <strong id="viewAsBannerPrimary" class="view-as-banner-primary"></strong>
                <span id="viewAsBannerSecondary" class="view-as-banner-secondary"></span>
            </div>
            <button type="button" id="viewAsBannerExitBtn" class="btn btn-small view-as-banner-exit" data-view-as-i18n="viewAsExitBtn">Exit View As</button>
        </div>
    </div>

    <header class="planner-page-header">
        <div class="planner-page-header-main">
            <a href="/" class="planner-back-link" data-i18n="plannerBackCalendar">← Calendar</a>
            <h1 class="planner-page-title" data-i18n="plannerPageTitle">Schedule planner</h1>
            <p id="plannerCalendarLabel" class="planner-calendar-label section-hint"></p>
        </div>
        <div class="planner-page-header-actions">
            <button type="button" id="plannerLangToggle" class="btn btn-outline btn-small btn-lang">🌐 한국어</button>
            <button type="button" id="plannerThemeToggle" class="btn btn-outline btn-small btn-header-theme">🌙 Dark</button>
        </div>
    </header>

    <div id="plannerInitErrorBanner" class="planner-init-error-banner" hidden role="alert">
        <span id="plannerInitErrorText"></span>
        <button type="button" id="plannerInitRetryBtn" class="btn btn-primary btn-small" data-i18n="workspaceReload">Reload</button>
    </div>

    <div id="plannerRemoteBanner" class="remote-newer-banner planner-remote-banner" hidden role="alert">
        <span data-i18n="workspaceRemoteNewer">Calendar was updated elsewhere.</span>
        <button type="button" id="plannerReloadBtn" class="btn btn-primary btn-small" data-i18n="workspaceReload">Reload</button>
    </div>

    <p id="plannerSyncHint" class="planner-sync-hint section-hint" hidden role="status"></p>
    <p id="plannerReadOnlyBanner" class="planner-readonly-banner" hidden role="status" data-i18n="plannerReadOnlyHint">This calendar is read-only. Request edit access before applying a draft.</p>

    <div id="teamLockSyncBar" class="team-lock-sync-bar" hidden aria-live="polite"></div>

    <main id="plannerPageRoot" class="sp-root" hidden>
        <div class="sp-topbar">
            <div class="sp-topbar-row">
                <div class="sp-seg" role="group" data-i18n-aria-label="spViewLabel" aria-label="Sheet">
                    <button type="button" class="sp-seg-btn" data-sp-view="teachers" data-i18n="spViewTeachers">Teachers</button>
                    <button type="button" class="sp-seg-btn" data-sp-view="cohorts" data-i18n="spViewCohorts">Cohorts</button>
                    <button type="button" class="sp-seg-btn" data-sp-view="rooms" data-i18n="spViewRooms">Rooms</button>
                </div>
                <div id="spDays" class="sp-days" role="group" aria-label="Day"></div>
                <select id="spBand" class="field-select sp-band" data-i18n-aria-label="spBandLabel" aria-label="Level">
                    <option value="all" data-i18n="spBandAll">All levels</option>
                    <option value="junior" data-i18n="plannerJunior">Junior</option>
                    <option value="middle" data-i18n="plannerMiddle">Middle</option>
                    <option value="senior" data-i18n="plannerSenior">Senior</option>
                </select>
                <div class="sp-topbar-actions">
                    <button type="button" id="spUndoBtn" class="btn btn-outline btn-small" data-act="undo" data-i18n="spUndo" disabled>Undo</button>
                    <button type="button" id="spRedoBtn" class="btn btn-outline btn-small" data-act="redo" data-i18n="spRedo" disabled>Redo</button>
                    <button type="button" class="btn btn-outline btn-small" data-act="open-setup" data-i18n="spSetup">Setup</button>
                    <button type="button" id="spAutoBtn" class="btn btn-secondary btn-small" data-act="auto" data-i18n="spAuto">Auto-schedule</button>
                    <div class="sp-menu-wrap">
                        <button type="button" class="btn btn-outline btn-small" data-menu="spToolsMenu" aria-haspopup="true" aria-expanded="false" data-i18n="spTools">Tools ▾</button>
                        <div id="spToolsMenu" class="sp-menu" hidden>
                            <button type="button" data-act="load-calendar" data-i18n="spToolLoad">Load from calendar</button>
                            <button type="button" data-act="clear-board" data-i18n="spToolClear">Clear the board</button>
                        </div>
                    </div>
                    <div class="sp-menu-wrap">
                        <button type="button" class="btn btn-outline btn-small" data-menu="spPrintMenu" aria-haspopup="true" aria-expanded="false" data-i18n="spPrint">Print ▾</button>
                        <div id="spPrintMenu" class="sp-menu" hidden>
                            <button type="button" data-act="print" data-kind="teachers" data-i18n="spPrintTeachers">Teacher timetables</button>
                            <button type="button" data-act="print" data-kind="rooms" data-i18n="spPrintRoomSchedule">Room schedule (one page per day)</button>
                            <button type="button" data-act="print" data-kind="cohorts" data-i18n="spPrintCohorts">Cohort timetables</button>
                            <button type="button" data-act="print" data-kind="byroom" data-i18n="spPrintRooms">Room timetables</button>
                        </div>
                    </div>
                    <button type="button" id="plannerApplyBtn" class="btn btn-primary btn-small" data-act="apply" data-i18n="plannerApply">Apply to calendar</button>
                </div>
            </div>
            <div id="spSummary" class="sp-summary" role="status"></div>
        </div>

        <div class="sp-layout">
            <aside id="spTray" class="sp-tray" data-i18n-aria-label="spTrayLabel" aria-label="Classes">
                <input type="search" id="spSearch" class="module-list-search sp-search" autocomplete="off" spellcheck="false" data-i18n-placeholder="plannerBinSearchPlaceholder" placeholder="Search classes…">
                <p class="sp-hint sp-tray-hint" data-i18n="spTrayHint">Drag a class onto the board. Drag it back here to take it off.</p>
                <div id="spTrayList" class="sp-tray-list"></div>
                <div id="spInspector" class="sp-inspector" hidden></div>
            </aside>
            <section id="spBoard" class="sp-board" data-i18n-aria-label="spBoardLabel" aria-label="Timetable board"></section>
            <aside id="spIssues" class="sp-issues" data-i18n-aria-label="spIssuesTitle" aria-label="To fix"></aside>
        </div>
    </main>

    <div id="spSetup" class="sp-overlay" hidden>
        <div class="sp-dialog" role="dialog" aria-modal="true" aria-labelledby="spSetupTitle">
            <header class="sp-dialog-head">
                <h2 id="spSetupTitle" data-i18n="spSetupTitle">Planner setup</h2>
                <div class="sp-seg" role="tablist">
                    <button type="button" role="tab" class="sp-seg-btn" data-setup-tab="cohorts" data-i18n="spViewCohorts">Cohorts</button>
                    <button type="button" role="tab" class="sp-seg-btn" data-setup-tab="teachers" data-i18n="spViewTeachers">Teachers</button>
                    <button type="button" role="tab" class="sp-seg-btn" data-setup-tab="rooms" data-i18n="spViewRooms">Rooms</button>
                    <button type="button" role="tab" class="sp-seg-btn" data-setup-tab="classes" data-i18n="spSetupClasses">Classes</button>
                </div>
                <button type="button" class="btn btn-primary btn-small" data-act="close-setup" data-i18n="spDone">Done</button>
            </header>
            <div id="spSetupBody" class="sp-dialog-body"></div>
        </div>
    </div>

    <div id="spAuto" class="sp-overlay" hidden>
        <div class="sp-dialog sp-dialog--auto" role="dialog" aria-modal="true" aria-labelledby="spAutoTitle">
            <header class="sp-dialog-head">
                <h2 id="spAutoTitle" data-i18n="spAutoTitle">Auto-schedule</h2>
                <button type="button" class="btn btn-outline btn-small" data-act="close-auto" data-i18n="spClose">Close</button>
            </header>
            <div id="spAutoBody" class="sp-dialog-body"></div>
        </div>
    </div>

    <div id="spFix" class="sp-overlay" hidden>
        <div class="sp-dialog sp-dialog--auto" role="dialog" aria-modal="true" aria-labelledby="spFixTitle">
            <header class="sp-dialog-head">
                <h2 id="spFixTitle" data-i18n="spFixTitle">Ways to fix the clashes</h2>
                <button type="button" class="btn btn-outline btn-small" data-act="close-fix" data-i18n="spFixByHand">I’ll fix it by hand</button>
            </header>
            <div id="spFixBody" class="sp-dialog-body"></div>
        </div>
    </div>

    <div id="spConfirm" class="sp-overlay sp-overlay--confirm" hidden>
        <div class="sp-dialog sp-dialog--small" role="alertdialog" aria-modal="true" aria-describedby="spConfirmText">
            <p id="spConfirmText" class="sp-confirm-text"></p>
            <div class="sp-confirm-actions">
                <button type="button" class="btn btn-outline btn-small" data-confirm="cancel" data-i18n="spCancel">Cancel</button>
                <button type="button" id="spConfirmOk" class="btn btn-primary btn-small" data-confirm="ok">OK</button>
            </div>
        </div>
    </div>

    <div id="plannerPrintArea" class="planner-print-area" aria-hidden="true"></div>

    <script defer src="js/page-chrome.js?v=20260918-viewport-p0"></script>
    <script defer src="js/schedule-core.js"></script>
    <script defer src="js/utils.js?v=20260606-clipboard-dash"></script>
    <script defer src="js/theme-toggle.js?v=20260527-modal-ux"></script>
    <script defer src="js/storage-prune.js?v=20261112-shared-logout"></script>
    <script defer src="js/session-restore.js?v=20260608-notes-app"></script>
    <script defer src="js/view-as-i18n.js?v=20260608-i18n-audit"></script>
    <script defer src="js/view-as-banner.js?v=20260608-i18n-audit"></script>
    <script defer src="js/team-auth.js?v=20261112-shared-logout"></script>
    <script defer src="js/sync-diff.js?v=20261111-live-sync"></script>
    <script defer src="js/calendar-mutations.js?v=20261111-live-sync"></script>
    <script defer src="js/calendar-sync.js?v=20261111-live-sync"></script>
    <script defer src="js/core/app-state.js?v=20260909-period8"></script>
    <script defer src="js/timetable-periods.js?v=20260909-period8"></script>
    <script defer src="js/teacher-timetable.js?v=20260909-period8"></script>
    <script defer src="js/planner/teacher-planner-core.js?v=20261114-planner-theme"></script>
    <script defer src="js/planner/teacher-planner-auto.js?v=20261114-planner-theme"></script>
    <script defer src="js/planner/teacher-planner-ui.js?v=20261114-planner-theme"></script>
    <script defer src="js/i18n/calendar-en.js?v=20261114-planner-theme"></script>
    <script defer src="js/i18n/calendar-i18n.js?v=20260622-i18n-lazy"></script>
    <script defer src="js/level-profile.js?v=20261015-p7-level"></script>
    <script defer src="app.js?v=20261015-p7-level"></script>
    <script defer src="js/planner/teacher-planner-page.js?v=20261114-planner-theme"></script>
</body>
</html>
