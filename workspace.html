<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting… — Class Calendar</title>
    <script src="js/language-init.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var tab = params.get('tab');
            var zone = tab === 'books' ? 'classes' : 'schedule';
            var segment = tab === 'books' ? 'curriculum' : 'homework';
            var dest = '/?zone=' + zone + '&segment=' + segment + '&contentExpanded=1';
            if (params.get('book')) {
                dest += '&book=' + encodeURIComponent(params.get('book'));
            }
            if (params.get('classId')) {
                dest += '&classId=' + encodeURIComponent(params.get('classId'));
            }
            location.replace(dest);
        })();
    </script>
</head>
<body>
    <p>Redirecting to the calendar app…</p>
</body>
</html>
