<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Class day notes · ClassManager</title>
    <script>document.documentElement.classList.add('ccp-auth-boot');</script>
    <style>html.ccp-auth-boot body{visibility:hidden}html.ccp-auth-boot{background:var(--bg-main,#f4f6f9)}</style>
    <script src="js/theme-init.js"></script>
    <script src="js/language-init.js"></script>
    <script>
        // Korean i18n bundle: loaded here only for Korean users (ready before
        // first paint); English always loads in the body and is the fallback.
        window.CCP_I18N_VERSION = '20260806-cohort-color';
        (function () {
            try {
                var lang = (window.CCPLanguage && window.CCPLanguage.resolveCalendarLanguage)
                    ? window.CCPLanguage.resolveCalendarLanguage()
                    : 'en';
                if (lang === 'ko') {
                    document.write(
                        '<scr' + 'ipt defer src="js/i18n/calendar-ko.js?v='
                        + window.CCP_I18N_VERSION + '"></scr' + 'ipt>'
                    );
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20260831-auth-boot-fix">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="notes-page">
    <div id="appNoticeRail" class="app-notice-rail" role="status" aria-live="polite" aria-hidden="true"></div>
    <div id="viewAsBanner" class="view-as-banner" hidden role="status" aria-live="polite">
        <div class="view-as-banner-inner">
            <div class="view-as-banner-text">
                <strong id="viewAsBannerPrimary" class="view-as-banner-primary"></strong>
                <span id="viewAsBannerSecondary" class="view-as-banner-secondary"></span>
            </div>
            <button type="button" id="viewAsBannerExitBtn" class="btn btn-small view-as-banner-exit" data-view-as-i18n="viewAsExitBtn">Exit View As</button>
        </div>
    </div>

    <header class="notes-header">
        <div class="notes-header-main">
            <a href="/" class="notes-back-link" data-i18n="notesBackCalendar">&larr; Calendar</a>
            <h1 class="notes-title" data-i18n="notesPageTitle">Class day notes</h1>
            <p id="notesCalendarLabel" class="notes-calendar-label section-hint"></p>
        </div>
        <div class="notes-header-actions">
            <button type="button" id="notesLangToggle" class="btn btn-outline btn-small btn-lang" data-i18n="langToggle">Language</button>
            <button type="button" id="notesThemeToggle" class="btn btn-outline btn-small btn-header-theme" data-i18n="themeDark">Dark</button>
        </div>
    </header>

    <div id="notesInitErrorBanner" class="notes-init-error-banner" hidden role="alert">
        <span id="notesInitErrorText"></span>
        <button type="button" id="notesInitRetryBtn" class="btn btn-primary btn-small" data-i18n="workspaceReload">Reload</button>
    </div>

    <div id="notesRemoteBanner" class="remote-newer-banner notes-remote-banner" hidden role="alert">
        <span data-i18n="workspaceRemoteNewer">Calendar was updated elsewhere.</span>
        <button type="button" id="notesReloadBtn" class="btn btn-primary btn-small" data-i18n="workspaceReload">Reload</button>
    </div>

    <p id="notesSyncHint" class="notes-sync-hint section-hint" hidden role="status"></p>

    <p id="notesReadOnlyBanner" class="notes-readonly-banner" hidden role="status"></p>

    <div class="notes-date-bar">
        <button type="button" id="notesPrevDayBtn" class="btn btn-outline btn-small notes-day-nav-btn" aria-label="Previous day">&lsaquo;</button>
        <label class="notes-date-label" for="notesDateInput">
            <span class="visually-hidden" data-i18n="dayNotesSummaryDate">Date</span>
            <input type="date" id="notesDateInput" class="field-input notes-date-input">
        </label>
        <button type="button" id="notesNextDayBtn" class="btn btn-outline btn-small notes-day-nav-btn" aria-label="Next day">&rsaquo;</button>
        <button type="button" id="notesTodayBtn" class="btn btn-outline btn-small" data-i18n="homeworkTabToday">Today</button>
        <button type="button" id="notesMyClassesTodayBtn" class="btn btn-outline btn-small" data-i18n="classNotesMyClassesToday">My classes &middot; Today</button>
    </div>

    <main class="notes-main">
        <label class="notes-filter-my-classes checkbox-label selection-chip" id="notesMyClassesOnlyLabel" data-filter-preset="my-classes">
            <input type="checkbox" id="notesMyClassesOnly">
            <span data-i18n="filterMyClassesOnly">My classes only</span>
        </label>

        <section class="notes-class-section" aria-labelledby="notesClassListHeading">
            <h2 id="notesClassListHeading" class="visually-hidden">Classes</h2>
            <div class="notes-class-search-wrap">
                <label class="visually-hidden" for="notesClassSearch" data-i18n="classListSearchPlaceholder">Search classes&hellip;</label>
                <input
                    type="search"
                    id="notesClassSearch"
                    class="module-list-search notes-class-search"
                    autocomplete="off"
                    spellcheck="false"
                    data-i18n-placeholder="classListSearchPlaceholder"
                    placeholder="Search classes&hellip;"
                >
            </div>
            <p id="notesClassListEmpty" class="module-empty-hint" hidden data-i18n="notesNoClasses">No classes in this calendar.</p>
            <div id="notesClassList" class="notes-class-list" role="list" aria-label="Classes"></div>
        </section>

        <p id="notesPickClassHint" class="module-empty-hint notes-pick-hint" data-i18n="notesSelectClass">Tap a class to add or view notes.</p>
    </main>

    <div id="notesEditorBackdrop" class="notes-editor-backdrop" hidden aria-hidden="true"></div>
    <aside
        id="notesEditorSheet"
        class="notes-editor-sheet"
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="notesEditorTitle"
    >
        <div class="notes-editor-sheet-inner">
            <div class="notes-editor-sheet-handle" aria-hidden="true"></div>
            <header class="notes-editor-sheet-header">
                <div class="notes-editor-sheet-heading">
                    <h2 id="notesEditorTitle" class="notes-editor-title"></h2>
                    <p id="notesEditorMeta" class="notes-editor-meta section-hint"></p>
                </div>
                <button
                    type="button"
                    id="notesEditorCloseBtn"
                    class="btn btn-outline btn-small notes-editor-close-btn"
                    data-i18n-aria-label="notesEditorClose"
                >&times;</button>
            </header>
            <div id="notesEditorSection" class="notes-editor-sheet-body">
                <div id="notesExistingList" class="notes-existing-list" role="list"></div>
                <label class="notes-add-label" for="notesAddText">
                    <span data-i18n="dayNoteTextLabel">What happened in this class?</span>
                    <textarea id="notesAddText" class="day-note-textarea notes-add-textarea" rows="4" spellcheck="true"></textarea>
                </label>
                <div class="notes-editor-actions">
                    <button type="button" id="notesSaveBtn" class="btn btn-primary btn-small" data-i18n="dayNoteSave">Save note</button>
                </div>
                <p id="notesStatus" class="notes-status visually-hidden" role="status" aria-live="polite" hidden></p>
            </div>
        </div>
    </aside>

    <script defer src="js/page-chrome.js?v=20260619-viewport-tier"></script>
    <script defer src="js/schedule-core.js"></script>
    <script defer src="js/class-curriculum-slices.js?v=20260603-cal-suffix2"></script>
    <script defer src="js/utils.js?v=20260606-clipboard-dash"></script>
    <script defer src="js/theme-toggle.js?v=20260527-modal-ux"></script>
    <script defer src="js/storage-prune.js?v=20260604-session-prune"></script>
    <script defer src="js/session-restore.js?v=20260608-notes-app"></script>
    <script defer src="js/view-as-i18n.js?v=20260608-i18n-audit"></script>
    <script defer src="js/view-as-banner.js?v=20260608-i18n-audit"></script>
    <script defer src="js/team-auth.js?v=20260601-role-palette"></script>
    <script defer src="js/calendar-mutations.js?v=20260806-patch-mutations"></script>
    <script defer src="js/conflict-merge.js?v=20260806-patch-mutations"></script>
    <script defer src="js/calendar-sync.js?v=20260807-deconflict-min"></script>
    <script defer src="js/debate-periods.js?v=20260602-footprint"></script>
    <script defer src="js/classroom-domain.js?v=20260807-deconflict-min"></script>
    <script defer src="js/day-note-categories.js?v=20260612-note-categories"></script>
    <script defer src="js/day-notes.js?v=20260603-daynote-author"></script>
    <script defer src="js/day-note-mentions.js?v=20260824-mention-no-at-colon"></script>
    <script defer src="js/class-notes-panel.js?v=20260612-mention-focus"></script>
    <script defer src="js/teacher-timetable.js?v=20260807-deconflict-min"></script>
    <script defer src="js/i18n/calendar-en.js?v=20260806-patch-mutations"></script>
    <script defer src="js/i18n/calendar-i18n.js?v=20260622-i18n-lazy"></script>
    <script defer src="js/day-notes-save.js?v=20260622-day-notes-save"></script>
    <script defer src="app.js?v=20260831-auth-boot-fix"></script>
    <script defer src="js/notes.js?v=20260831-auth-boot-fix"></script>
</body>
</html>
