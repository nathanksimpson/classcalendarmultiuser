<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Class day notes — Class Calendar</title>
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="styles.css?v=20260616-notes-class-search">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="notes-page">
    <div id="viewAsBanner" class="view-as-banner" hidden role="status" aria-live="polite">
        <div class="view-as-banner-inner">
            <div class="view-as-banner-text">
                <strong id="viewAsBannerPrimary" class="view-as-banner-primary"></strong>
                <span id="viewAsBannerSecondary" class="view-as-banner-secondary"></span>
            </div>
            <button type="button" id="viewAsBannerExitBtn" class="btn btn-small view-as-banner-exit">Exit View As</button>
        </div>
    </div>

    <header class="notes-header">
        <div class="notes-header-main">
            <a href="/" class="notes-back-link" data-i18n="notesBackCalendar">← Calendar</a>
            <h1 class="notes-title" data-i18n="notesPageTitle">Class day notes</h1>
            <p id="notesCalendarLabel" class="notes-calendar-label section-hint"></p>
        </div>
        <div class="notes-header-actions">
            <button type="button" id="notesLangToggle" class="btn btn-outline btn-small btn-lang">🌐 한국어</button>
            <button type="button" id="notesThemeToggle" class="btn btn-outline btn-small btn-header-theme">🌙 Dark</button>
        </div>
    </header>

    <div id="notesInitErrorBanner" class="notes-init-error-banner" hidden role="alert">
        <span id="notesInitErrorText"></span>
        <button type="button" id="notesInitRetryBtn" class="btn btn-primary btn-small" data-i18n="workspaceReload">Reload</button>
    </div>

    <div id="notesRemoteBanner" class="remote-newer-banner notes-remote-banner" hidden role="alert">
        <span data-i18n="workspaceRemoteNewer">Calendar was updated elsewhere.</span>
        <button type="button" id="notesReloadBtn" class="btn btn-primary btn-small" data-i18n="workspaceReload">Reload</button>
    </div>

    <p id="notesSyncHint" class="notes-sync-hint section-hint" hidden role="status"></p>

    <p id="notesReadOnlyBanner" class="notes-readonly-banner" hidden role="status"></p>

    <div class="notes-date-bar">
        <button type="button" id="notesPrevDayBtn" class="btn btn-outline btn-small notes-day-nav-btn" aria-label="Previous day">‹</button>
        <label class="notes-date-label" for="notesDateInput">
            <span class="visually-hidden" data-i18n="dayNotesSummaryDate">Date</span>
            <input type="date" id="notesDateInput" class="notes-date-input">
        </label>
        <button type="button" id="notesNextDayBtn" class="btn btn-outline btn-small notes-day-nav-btn" aria-label="Next day">›</button>
        <button type="button" id="notesTodayBtn" class="btn btn-outline btn-small" data-i18n="homeworkTabToday">Today</button>
    </div>

    <label class="notes-filter-my-classes" id="notesMyClassesOnlyLabel">
        <input type="checkbox" id="notesMyClassesOnly">
        <span data-i18n="notesMyClassesOnly">My classes only</span>
    </label>

    <main class="notes-main">
        <section class="notes-class-section" aria-labelledby="notesClassListHeading">
            <h2 id="notesClassListHeading" class="visually-hidden">Classes</h2>
            <div class="notes-class-search-wrap">
                <label class="visually-hidden" for="notesClassSearch" data-i18n="classListSearchPlaceholder">Search classes…</label>
                <input
                    type="search"
                    id="notesClassSearch"
                    class="module-list-search notes-class-search"
                    autocomplete="off"
                    spellcheck="false"
                    data-i18n-placeholder="classListSearchPlaceholder"
                    placeholder="Search classes…"
                >
            </div>
            <p id="notesClassListEmpty" class="module-empty-hint" hidden data-i18n="notesNoClasses">No classes in this calendar.</p>
            <div id="notesClassList" class="notes-class-list" role="list" aria-label="Classes"></div>
        </section>

        <p id="notesPickClassHint" class="module-empty-hint notes-pick-hint" data-i18n="notesSelectClass">Tap a class to add or view notes.</p>
    </main>

    <div id="notesEditorBackdrop" class="notes-editor-backdrop" hidden aria-hidden="true"></div>
    <aside
        id="notesEditorSheet"
        class="notes-editor-sheet"
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="notesEditorTitle"
    >
        <div class="notes-editor-sheet-inner">
            <div class="notes-editor-sheet-handle" aria-hidden="true"></div>
            <header class="notes-editor-sheet-header">
                <div class="notes-editor-sheet-heading">
                    <h2 id="notesEditorTitle" class="notes-editor-title"></h2>
                    <p id="notesEditorMeta" class="notes-editor-meta section-hint"></p>
                </div>
                <button
                    type="button"
                    id="notesEditorCloseBtn"
                    class="btn btn-outline btn-small notes-editor-close-btn"
                    data-i18n-aria-label="notesEditorClose"
                >×</button>
            </header>
            <div id="notesEditorSection" class="notes-editor-sheet-body">
                <div id="notesExistingList" class="notes-existing-list" role="list"></div>
                <label class="notes-add-label" for="notesAddText">
                    <span data-i18n="dayNoteTextLabel">What happened in this class?</span>
                    <textarea id="notesAddText" class="day-note-textarea notes-add-textarea" rows="4" spellcheck="true"></textarea>
                </label>
                <div class="notes-editor-actions">
                    <button type="button" id="notesSaveBtn" class="btn btn-primary" data-i18n="dayNoteSave">Save note</button>
                </div>
                <p id="notesStatus" class="notes-status" role="status" aria-live="polite" hidden></p>
            </div>
        </div>
    </aside>

    <div id="appStatus" class="app-status" role="status" aria-live="polite"></div>

    <script defer src="js/schedule-core.js"></script>
    <script defer src="js/class-curriculum-slices.js?v=20260603-migration-alert"></script>
    <script defer src="js/utils.js?v=20260527-modal-ux"></script>
    <script defer src="js/theme-toggle.js?v=20260527-modal-ux"></script>
    <script defer src="js/storage-prune.js?v=20260604-session-prune"></script>
    <script defer src="js/session-restore.js?v=20260608-notes-app"></script>
    <script defer src="js/view-as-banner.js?v=20260601-role-palette"></script>
    <script defer src="js/team-auth.js?v=20260601-role-palette"></script>
    <script defer src="js/calendar-sync.js?v=20260609-notes-daynotes"></script>
    <script defer src="js/debate-periods.js?v=20260602-footprint"></script>
    <script defer src="js/day-notes.js?v=20260603-daynote-author"></script>
    <script defer src="js/class-notes-panel.js?v=20260602-notes-text-search"></script>
    <script defer src="js/teacher-timetable.js?v=20260611-timetable-context"></script>
    <script defer src="app.js?v=20260616-notes-class-search"></script>
    <script defer src="js/notes.js?v=20260616-notes-deselect-on-load"></script>
</body>
</html>
