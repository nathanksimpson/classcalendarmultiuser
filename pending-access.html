<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for access — Class Calendar</title>
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="styles.css?v=20260601-unified-mobile">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .pending-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-main);
            color: var(--text-primary);
        }
        .pending-card {
            max-width: 440px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
        }
        .pending-card h1 {
            margin: 0 0 0.5rem;
            font-size: 1.35rem;
        }
        .pending-card p {
            margin: 0 0 1rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .pending-user {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
        }
        .pending-actions {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }
        .pending-actions .btn {
            width: 100%;
        }
        .pending-lang {
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .pending-lang button {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            padding: 0;
            font-size: inherit;
        }
        .pending-error {
            color: var(--status-error-color);
            font-size: 0.9rem;
            margin-top: 0.75rem;
            display: none;
        }
        .pending-edit-name {
            margin-bottom: 1.25rem;
        }
        .pending-edit-name label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }
        .pending-edit-name input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem 0.65rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--bg-main);
            color: var(--text-primary);
        }
        .pending-edit-name .btn {
            margin-top: 0.5rem;
            width: 100%;
        }
        .pending-name-saved {
            font-size: 0.85rem;
            color: var(--status-success-color, #15803d);
            margin-top: 0.35rem;
            display: none;
        }
        .pending-status-banner {
            background: color-mix(in srgb, var(--primary) 12%, var(--bg-main));
            border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--border-color));
            border-radius: 8px;
            padding: 0.85rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.92rem;
            line-height: 1.45;
            color: var(--text-primary);
            display: none;
        }
        .pending-welcome {
            font-size: 0.9rem;
            color: var(--status-success-color, #15803d);
            margin: 0 0 0.75rem;
            display: none;
        }
    </style>
</head>
<body>
    <div id="viewAsBanner" class="view-as-banner" hidden role="status" aria-live="polite">
        <div class="view-as-banner-inner">
            <div class="view-as-banner-text">
                <strong id="viewAsBannerPrimary" class="view-as-banner-primary"></strong>
                <span id="viewAsBannerSecondary" class="view-as-banner-secondary"></span>
            </div>
            <button type="button" id="viewAsBannerExitBtn" class="btn btn-small view-as-banner-exit">Exit View As</button>
        </div>
    </div>
    <div class="pending-page">
        <div class="pending-card">
            <div id="pendingStatusBanner" class="pending-status-banner" role="status" aria-live="polite"></div>
            <p id="pendingWelcome" class="pending-welcome"></p>
            <h1 id="pendingTitle">Waiting for calendar access</h1>
            <p id="pendingLead">You are signed in. A lead teacher or admin must assign you to a group or calendar before you can open the planner.</p>
            <p id="pendingHint">This usually takes a short time. You can leave this page and come back later, or click <strong>Check again</strong>.</p>
            <div class="pending-user" id="pendingUserBox" hidden>
                <span id="pendingSignedInLabel">Signed in as</span>:
                <strong id="pendingUserName">—</strong>
                <span id="pendingUserEmail"></span>
            </div>
            <div class="pending-edit-name" id="pendingEditNameBox" hidden>
                <label for="pendingDisplayNameInput" id="pendingDisplayNameLabel">Your display name</label>
                <input type="text" id="pendingDisplayNameInput" maxlength="120" autocomplete="name">
                <button type="button" class="btn btn-outline" id="pendingSaveNameBtn">Save name</button>
                <p id="pendingNameSaved" class="pending-name-saved"></p>
            </div>
            <div class="pending-actions">
                <button type="button" class="btn btn-primary" id="pendingCheckBtn">Check again</button>
                <button type="button" class="btn btn-outline" id="pendingSignOutBtn">Sign out</button>
            </div>
            <p id="pendingError" class="pending-error"></p>
            <p class="pending-lang">
                <button type="button" id="pendingLangEn">English</button>
                ·
                <button type="button" id="pendingLangKo">한국어</button>
            </p>
        </div>
    </div>
    <script defer src="js/view-as-banner.js?v=20260601-role-palette"></script>
    <script>
        (function () {
            function authHeaders(extra) {
                if (typeof ViewAsBanner !== 'undefined' && ViewAsBanner.authFetchHeaders) {
                    return ViewAsBanner.authFetchHeaders(extra);
                }
                return Object.assign({}, extra || {});
            }
            var LANG_KEY = 'pendingAccessLang';
            var APP_LANG_KEY = 'calendarLanguage';
            var copy = {
                en: {
                    title: 'Waiting for calendar access',
                    statusBanner:
                        'Pending admin approval — your account is waiting for calendar access.',
                    statusBannerNotified:
                        'Pending admin approval — your account is waiting for calendar access. Team admins have been notified.',
                    welcome: 'Account created successfully.',
                    lead: 'You are signed in. A lead teacher or admin must assign you to a group or calendar before you can open the planner.',
                    hint: 'This usually takes a short time. You can leave this page and come back later, or click <strong>Check again</strong>.',
                    signedIn: 'Signed in as',
                    displayNameLabel: 'Your display name',
                    saveName: 'Save name',
                    nameSaved: 'Name saved.',
                    nameRequired: 'Please enter a display name.',
                    nameSaveFailed: 'Could not save name.',
                    check: 'Check again',
                    signOut: 'Sign out',
                    notSignedIn: 'You are not signed in.',
                    stillWaiting: 'Still waiting — no calendars assigned yet.',
                    checkFailed: 'Could not check access. Try again.',
                    registerFailed: 'Could not register your access request. Try again.'
                },
                ko: {
                    title: '캘린더 접근 대기 중',
                    statusBanner:
                        '관리자 승인 대기 중 — 계정이 캘린더 접근 권한을 기다리고 있습니다.',
                    statusBannerNotified:
                        '관리자 승인 대기 중 — 계정이 캘린더 접근 권한을 기다리고 있습니다. 팀 관리자에게 알림이 전달되었습니다.',
                    welcome: '계정이 성공적으로 만들어졌습니다.',
                    lead: '로그인되었습니다. 플래너를 사용하려면 담당 선생님이나 관리자가 그룹 또는 캘린더에 배정해야 합니다.',
                    hint: '보통 시간이 조금 걸립니다. 이 페이지를 닫았다가 나중에 다시 오거나 <strong>다시 확인</strong>을 누르세요.',
                    signedIn: '로그인',
                    displayNameLabel: '표시 이름',
                    saveName: '이름 저장',
                    nameSaved: '이름이 저장되었습니다.',
                    nameRequired: '표시 이름을 입력하세요.',
                    nameSaveFailed: '이름을 저장할 수 없습니다.',
                    check: '다시 확인',
                    signOut: '로그아웃',
                    notSignedIn: '로그인되어 있지 않습니다.',
                    stillWaiting: '아직 대기 중입니다 — 배정된 캘린더가 없습니다.',
                    checkFailed: '접근 확인에 실패했습니다. 다시 시도해 주세요.',
                    registerFailed: '접근 요청을 등록할 수 없습니다. 다시 시도해 주세요.'
                }
            };

            function lang() {
                try {
                    var s = localStorage.getItem(LANG_KEY);
                    if (s === 'ko') {
                        return 'ko';
                    }
                    if (s === 'en') {
                        return 'en';
                    }
                    var appLang = localStorage.getItem(APP_LANG_KEY);
                    if (appLang === 'ko' || appLang === 'en') {
                        return appLang;
                    }
                } catch (_) { /* ignore */ }
                return 'en';
            }

            function setLang(next) {
                try {
                    var v = next === 'ko' ? 'ko' : 'en';
                    localStorage.setItem(LANG_KEY, v);
                    // Keep consistent with the rest of the app (login/admin/index).
                    localStorage.setItem(APP_LANG_KEY, v);
                } catch (_) { /* ignore */ }
                applyCopy();
            }

            function t(key) {
                return copy[lang()][key] || copy.en[key] || key;
            }

            function applyCopy() {
                document.getElementById('pendingTitle').textContent = t('title');
                document.getElementById('pendingLead').textContent = t('lead');
                document.getElementById('pendingHint').innerHTML = t('hint');
                document.getElementById('pendingSignedInLabel').textContent = t('signedIn');
                document.getElementById('pendingDisplayNameLabel').textContent = t('displayNameLabel');
                document.getElementById('pendingSaveNameBtn').textContent = t('saveName');
                document.getElementById('pendingCheckBtn').textContent = t('check');
                document.getElementById('pendingSignOutBtn').textContent = t('signOut');
                document.documentElement.lang = lang() === 'ko' ? 'ko' : 'en';
                if (lastStatusAdminNotified != null) {
                    showStatusBanner(lastStatusAdminNotified);
                }
            }

            var lastStatusAdminNotified = null;

            function showStatusBanner(adminNotified) {
                lastStatusAdminNotified = Boolean(adminNotified);
                var el = document.getElementById('pendingStatusBanner');
                el.textContent = adminNotified ? t('statusBannerNotified') : t('statusBanner');
                el.style.display = 'block';
            }

            function showWelcomeIfNeeded() {
                var params = new URLSearchParams(location.search);
                if (params.get('welcome') !== '1') {
                    return;
                }
                var el = document.getElementById('pendingWelcome');
                el.textContent = t('welcome');
                el.style.display = 'block';
            }

            function showError(msg) {
                var el = document.getElementById('pendingError');
                el.style.display = 'block';
                el.textContent = msg;
            }

            function clearError() {
                var el = document.getElementById('pendingError');
                el.style.display = 'none';
                el.textContent = '';
            }

            async function registerAccessRequest() {
                var res = await fetch('/api/access-request', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: '{}'
                });
                var json = await res.json().catch(function () {
                    return {};
                });
                if (!res.ok) {
                    throw new Error(json.error || 'register');
                }
                if (json.status === 'granted') {
                    location.replace('/');
                    return null;
                }
                showStatusBanner(json.adminNotified);
                return json;
            }

            async function fetchMe() {
                var res = await fetch('/api/auth/me', {
                    credentials: 'same-origin',
                    headers: authHeaders()
                });
                if (res.status === 401) {
                    return null;
                }
                if (!res.ok) {
                    throw new Error('me');
                }
                return res.json();
            }

            async function checkAccessAndMaybeRedirect() {
                clearError();
                var me = await fetchMe();
                if (!me) {
                    location.replace('/login.html?return=' + encodeURIComponent('/pending-access.html'));
                    return;
                }
                if (me.hasCalendarAccess) {
                    location.replace('/');
                    return;
                }
                var calRes = await fetch('/api/calendars', {
                    credentials: 'same-origin',
                    headers: authHeaders()
                });
                if (!calRes.ok) {
                    throw new Error('calendars');
                }
                var calendars = await calRes.json();
                if (Array.isArray(calendars) && calendars.length > 0) {
                    location.replace('/');
                    return;
                }
                clearError();
                var banner = document.getElementById('pendingStatusBanner');
                banner.textContent = t('stillWaiting');
                banner.style.display = 'block';
            }

            function showNameSaved(msg) {
                var el = document.getElementById('pendingNameSaved');
                el.textContent = msg || t('nameSaved');
                el.style.display = 'block';
            }

            function hideNameSaved() {
                var el = document.getElementById('pendingNameSaved');
                el.style.display = 'none';
                el.textContent = '';
            }

            async function saveDisplayName() {
                hideNameSaved();
                clearError();
                var input = document.getElementById('pendingDisplayNameInput');
                var name = (input && input.value ? input.value : '').trim();
                if (!name) {
                    showError(t('nameRequired'));
                    return;
                }
                var btn = document.getElementById('pendingSaveNameBtn');
                if (btn) {
                    btn.disabled = true;
                }
                try {
                    var res = await fetch('/api/auth/profile', {
                        method: 'PATCH',
                        credentials: 'same-origin',
                        headers: authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({ displayName: name })
                    });
                    var json = await res.json().catch(function () {
                        return {};
                    });
                    if (!res.ok) {
                        showError(json.error || t('nameSaveFailed'));
                        return;
                    }
                    document.getElementById('pendingUserName').textContent =
                        json.displayName || name;
                    showNameSaved(t('nameSaved'));
                } catch (_) {
                    showError(t('nameSaveFailed'));
                } finally {
                    if (btn) {
                        btn.disabled = false;
                    }
                }
            }

            async function init() {
                applyCopy();
                if (location.protocol === 'file:') {
                    showError('Open this page from your team server URL (https://…), not as a file on your PC.');
                    return;
                }
                try {
                    if (typeof ViewAsBanner !== 'undefined' && ViewAsBanner.activateViewAsFromUrl) {
                        await ViewAsBanner.activateViewAsFromUrl();
                    }
                } catch (err) {
                    showError((err && err.message) || 'View As link expired.');
                    return;
                }
                try {
                    var me = await fetchMe();
                    if (!me) {
                        location.replace('/login.html?return=' + encodeURIComponent('/pending-access.html'));
                        return;
                    }
                    if (me.hasCalendarAccess) {
                        location.replace('/');
                        return;
                    }
                    var box = document.getElementById('pendingUserBox');
                    box.hidden = false;
                    document.getElementById('pendingUserName').textContent =
                        me.displayName || me.email || 'Teacher';
                    var emailEl = document.getElementById('pendingUserEmail');
                    if (me.email) {
                        emailEl.textContent = ' (' + me.email + ')';
                    } else {
                        emailEl.textContent = '';
                    }
                    var editBox = document.getElementById('pendingEditNameBox');
                    editBox.hidden = false;
                    document.getElementById('pendingDisplayNameInput').value =
                        me.displayName || me.email || '';
                    if (typeof ViewAsBanner !== 'undefined' && ViewAsBanner.renderViewAsBanner) {
                        ViewAsBanner.renderViewAsBanner(me);
                    }
                    showWelcomeIfNeeded();
                    try {
                        await registerAccessRequest();
                    } catch (_) {
                        showError(t('registerFailed'));
                    }
                } catch (_) {
                    showError(t('checkFailed'));
                }
            }

            document.getElementById('pendingSaveNameBtn').addEventListener('click', function () {
                saveDisplayName();
            });
            document.getElementById('pendingCheckBtn').addEventListener('click', function () {
                checkAccessAndMaybeRedirect().catch(function () {
                    showError(t('checkFailed'));
                });
            });
            document.getElementById('pendingSignOutBtn').addEventListener('click', function () {
                if (typeof ViewAsBanner !== 'undefined' && ViewAsBanner.getViewAsToken && ViewAsBanner.getViewAsToken()) {
                    ViewAsBanner.exitViewAs().catch(function () {
                        location.href = '/login.html';
                    });
                    return;
                }
                fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
                    .catch(function () { /* ignore */ })
                    .finally(function () {
                        location.href = '/login.html';
                    });
            });
            document.getElementById('pendingLangEn').addEventListener('click', function () {
                setLang('en');
            });
            document.getElementById('pendingLangKo').addEventListener('click', function () {
                setLang('ko');
            });

            init();
        })();
    </script>
</body>
</html>
