<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Class Calendar</title>
    <link rel="stylesheet" href="styles.css?v=20260523-admin">
    <style>
        .admin-page { max-width: 720px; margin: 2rem auto; padding: 0 1rem 3rem; }
        .admin-page h1 { margin-bottom: 0.25rem; }
        .admin-hint { color: var(--text-muted, #64748b); margin-bottom: 1.5rem; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .admin-table th, .admin-table td { border-bottom: 1px solid var(--border-color, #e2e8f0); padding: 0.5rem; text-align: left; }
        .admin-form { display: grid; gap: 0.5rem; margin: 1.5rem 0; padding: 1rem; border: 1px solid var(--border-color, #e2e8f0); border-radius: 8px; }
        .admin-form input, .admin-form select { padding: 0.45rem 0.6rem; border-radius: 6px; border: 1px solid #cbd5e1; }
        .badge-inactive { color: #b91c1c; }
        .admin-nav { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="admin-page">
        <p class="admin-nav" id="adminNav"><a href="/">← Back to calendar</a> · <a href="login.html" id="adminSignInLink">Sign in</a></p>
        <h1>Teacher access</h1>
        <p class="admin-hint">Add teachers by <strong>email</strong> (recommended). They sign in with Kakao; you never need to ask them for a Kakao ID.</p>
        <p id="adminStatus" class="admin-hint"></p>

        <table class="admin-table" id="usersTable" hidden>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="usersBody"></tbody>
        </table>

        <form class="admin-form" id="addUserForm">
            <h2 style="margin:0;font-size:1.1rem;">Add teacher</h2>
            <label>Display name <input type="text" id="newDisplayName" required></label>
            <label>Email <input type="email" id="newEmail" required></label>
            <label>Role
                <select id="newRole">
                    <option value="teacher">Teacher</option>
                    <option value="admin">Admin</option>
                </select>
            </label>
            <label>Optional temp password <input type="password" id="newPassword" autocomplete="new-password"></label>
            <button type="submit" class="btn btn-primary">Add user</button>
        </form>

        <section class="admin-form" id="bootstrapBox" style="display: none;">
            <h2 style="margin:0;font-size:1.1rem;">First-time setup</h2>
            <p>No admin exists yet. Use the bootstrap secret from your server <code>.env</code>.</p>
            <label>Bootstrap secret <input type="password" id="bootstrapSecret"></label>
            <label>Your email <input type="email" id="bootstrapEmail" required></label>
            <label>Your name <input type="text" id="bootstrapName" value="Lead teacher"></label>
            <label>Password (optional) <input type="password" id="bootstrapPassword"></label>
            <button type="button" class="btn btn-primary" id="bootstrapBtn">Create admin account</button>
        </section>
    </div>
    <script src="js/team-auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
