name: Build Sync Helper

# Run from the Actions tab (Run workflow), or push a tag like sync-helper-1.1.0.
on:
  workflow_dispatch:
  push:
    tags: ['sync-helper-*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:helper
      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc helper\installer.iss
      - name: SHA-256
        id: sha
        shell: pwsh
        run: |
          $h = (Get-FileHash helper\build\ClassManagerSyncSetup.exe -Algorithm SHA256).Hash.ToLower()
          "sha=$h" >> $env:GITHUB_OUTPUT
          "SHA-256: $h" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        with:
          name: ClassManagerSyncSetup
          path: helper/build/ClassManagerSyncSetup.exe
      - name: Publish release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/sync-helper-')
        uses: softprops/action-gh-release@v2
        with:
          files: helper/build/ClassManagerSyncSetup.exe
          body: "SHA-256: ${{ steps.sha.outputs.sha }}"
