<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Class Calendar</title>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('calendarTheme');
                if (theme === 'dark' || theme === 'light') {
                    document.documentElement.setAttribute('data-theme', theme);
                    document.documentElement.style.colorScheme = theme;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.documentElement.style.colorScheme = 'dark';
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20260528-login-theme">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-main);
            color: var(--text-primary);
        }
        .login-theme-bar {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 10;
            padding: 0.75rem 1rem;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
        }
        .login-card h1 {
            margin: 0 0 0.5rem;
            font-size: 1.35rem;
            color: var(--text-primary);
        }
        .login-card p {
            margin: 0 0 1.25rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .login-kakao {
            display: block;
            width: 100%;
            padding: 0.85rem 1rem;
            border: none;
            border-radius: 8px;
            background: #fee500;
            color: #191600;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .login-kakao:hover {
            filter: brightness(0.97);
        }
        .login-denied {
            background: var(--status-error-bg);
            border: 1px solid var(--status-error-border);
            color: var(--status-error-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .login-denied code {
            font-size: 0.85rem;
            word-break: break-all;
        }
        .login-fallback {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }
        .login-fallback label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .login-fallback input {
            width: 100%;
            margin-bottom: 0.75rem;
            padding: 0.5rem 0.65rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-primary);
        }
        .login-error {
            color: var(--status-error-color);
            font-size: 0.9rem;
            margin-top: 0.75rem;
        }
        .login-admin-link {
            margin-top: 1rem;
            font-size: 0.85rem;
        }
        .login-admin-link a {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-theme-bar">
        <button
            type="button"
            id="loginThemeToggle"
            class="btn btn-outline btn-small btn-header-theme"
            aria-pressed="false"
            title="Switch light/dark theme"
        >🌙 Dark</button>
    </div>
    <div class="login-page">
        <div class="login-card">
            <h1>Class Calendar — Team</h1>
            <p>Sign in with your school Kakao account. Your lead teacher must add your email first.</p>

            <div id="deniedBox" class="login-denied" style="display: none;">
                <strong>Access not granted yet</strong>
                <p>Send this to your calendar admin so they can add you:</p>
                <p>Email: <code id="deniedEmail">—</code></p>
                <p>Kakao ID (for admin only): <code id="deniedKakaoId">—</code></p>
            </div>

            <a id="kakaoLoginBtn" class="login-kakao" href="/api/auth/kakao">Login with Kakao</a>

            <div class="login-fallback">
                <p><strong>Password fallback</strong> (only if your admin gave you one)</p>
                <form id="passwordForm">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="email" autocomplete="username" required>
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Sign in</button>
                </form>
                <p id="loginError" class="login-error" style="display: none;"></p>
            </div>

        </div>
    </div>
    <script>
        (function () {
            function getStoredTheme() {
                try {
                    var saved = localStorage.getItem('calendarTheme');
                    if (saved === 'light' || saved === 'dark') {
                        return saved;
                    }
                } catch (_) { /* ignore */ }
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    return 'dark';
                }
                return 'light';
            }

            function applyLoginTheme(theme) {
                var next = theme === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', next);
                document.documentElement.style.colorScheme = next;
                try {
                    localStorage.setItem('calendarTheme', next);
                } catch (_) { /* ignore */ }
                var btn = document.getElementById('loginThemeToggle');
                if (btn) {
                    btn.textContent = next === 'dark' ? '☀️ Light' : '🌙 Dark';
                    btn.setAttribute('aria-pressed', next === 'dark' ? 'true' : 'false');
                    btn.title = 'Switch light/dark theme';
                }
            }

            applyLoginTheme(getStoredTheme());

            var themeBtn = document.getElementById('loginThemeToggle');
            if (themeBtn) {
                themeBtn.addEventListener('click', function () {
                    var current =
                        document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
                    applyLoginTheme(current === 'dark' ? 'light' : 'dark');
                });
            }

            const params = new URLSearchParams(location.search);
            const returnTo = params.get('return') || '/';
            const kakaoBtn = document.getElementById('kakaoLoginBtn');
            kakaoBtn.href = '/api/auth/kakao?return=' + encodeURIComponent(returnTo);

            if (params.get('denied') === '1') {
                document.getElementById('deniedBox').style.display = 'block';
                document.getElementById('deniedEmail').textContent = params.get('email') || '(not shared by Kakao)';
                document.getElementById('deniedKakaoId').textContent = params.get('kakaoId') || '—';
            }

            if (params.get('signedOut') === 'idle') {
                const el = document.getElementById('loginError');
                el.style.display = 'block';
                el.textContent = 'You were signed out due to inactivity. Sign in again to continue.';
            }

            const err = params.get('error');
            if (err) {
                const el = document.getElementById('loginError');
                el.style.display = 'block';
                el.textContent =
                    err === 'oauth_failed'
                        ? 'Kakao sign-in failed. Try again or contact your admin.'
                        : 'Sign-in problem: ' + err;
            }

            document.getElementById('passwordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const errEl = document.getElementById('loginError');
                const submitBtn = e.target.querySelector('button[type="submit"]');
                errEl.style.display = 'none';
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                if (!email || !password) {
                    errEl.style.display = 'block';
                    errEl.textContent = 'Enter your email and password.';
                    return;
                }
                if (submitBtn) {
                    submitBtn.disabled = true;
                }
                try {
                    const res = await fetch('/api/auth/password', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const json = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        throw new Error(json.error || 'Sign in failed');
                    }
                    const dest = returnTo.startsWith('/') && !returnTo.startsWith('//') ? returnTo : '/';
                    location.replace(dest);
                } catch (ex) {
                    errEl.style.display = 'block';
                    const msg = ex && ex.message ? ex.message : 'Sign in failed';
                    if (msg === 'Failed to fetch' || msg.includes('NetworkError')) {
                        errEl.textContent =
                            'Cannot reach the server. Open the team URL from your browser (https://…workers.dev), not a file on your PC.';
                    } else {
                        errEl.textContent = msg;
                    }
                } finally {
                    if (submitBtn) {
                        submitBtn.disabled = false;
                    }
                }
            });
        })();
    </script>
</body>
</html>
