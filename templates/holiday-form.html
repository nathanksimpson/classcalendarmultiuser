<form id="holidayForm" data-editor-mode="full">
                <input type="hidden" id="holidayId" value="">

                <div class="event-editor-header modal-header">
                    <h2 id="holidayModalTitle" data-i18n="addHolidayTitle">Add Holiday</h2>
                    <div class="event-editor-header-actions editor-header-actions">
                        <button type="submit" class="btn btn-primary btn-small editor-header-save-btn" data-i18n="saveEvent">Save Event</button>
                        <details class="header-dropdown editor-header-more">
                            <summary class="btn btn-outline btn-small editor-header-more-btn header-dropdown-trigger" aria-label="More actions">&#8942;</summary>
                            <div class="header-dropdown-panel editor-header-more-menu">
                                <button type="button" id="openEventInTabBtn" class="header-dropdown-item event-open-full-btn" data-i18n="openFullEventEditor">Open full editor</button>
                                <button type="button" id="deleteHolidayBtn" class="header-dropdown-item header-dropdown-item--danger" style="display: none;" data-i18n="delete">Delete</button>
                            </div>
                        </details>
                        <button type="button" class="modal-close" id="closeHolidayModal" aria-label="Close">&times;</button>
                    </div>
                </div>

                <div class="event-modal-body">
                <div class="form-group event-popout-name-field">
                    <label for="holidayName" data-i18n="holidayName">Holiday/Event Name</label>
                    <input type="text" id="holidayName" required data-i18n-placeholder="holidayNamePlaceholder" placeholder="e.g., Thanksgiving">
                </div>

                <div class="form-group event-color-group editor-popout-colors">
                    <label data-i18n="bgColor">Color</label>
                    <input type="hidden" id="holidayAccentColor" value="#cfa23a">
                    <input type="hidden" id="holidayBgColor" value="#fef3c7">
                    <input type="hidden" id="holidayTextColor" value="#b45309">
                    <div id="eventColorPaletteGrid" class="class-color-palette-host" role="group" aria-label="Event color"></div>
                    <div id="eventColorPreviewRow" class="class-color-preview-host" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="holidayIsRange">
                        <span data-i18n="dateRange">Date Range (multiple days)</span>
                    </label>
                </div>

                <div id="holidaySingleDate" class="form-group">
                    <label for="holidayDate" data-i18n="date">Date</label>
                    <input type="date" id="holidayDate">
                </div>

                <div id="holidayDateRange" class="form-row" style="display: none;">
                    <div class="form-group">
                        <label for="holidayStartDate" data-i18n="startDate">Start Date</label>
                        <input type="date" id="holidayStartDate">
                    </div>
                    <div class="form-group">
                        <label for="holidayEndDate" data-i18n="endDate">End Date</label>
                        <input type="date" id="holidayEndDate">
                    </div>
                </div>

                <div class="form-group" id="eventNotifyGroup">
                    <label data-i18n="eventNotifyLabel">Day notification</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="eventNotifyOnStart">
                            <span id="eventNotifyOnStartLabel" data-i18n="eventNotifyOnDay">Notify on this day</span>
                        </label>
                        <label class="checkbox-label" id="eventNotifyOnEndRow" style="display: none;">
                            <input type="checkbox" id="eventNotifyOnEnd">
                            <span data-i18n="eventNotifyOnEnd">Notify on end date</span>
                        </label>
                    </div>
                    <p class="section-hint" data-i18n="eventNotifyHint">Shows in the Notifications bell when you open ClassManager on that day.</p>
                </div>

                <div class="form-group">
                    <label for="eventType" data-i18n="eventType">Event type</label>
                    <select id="eventType" required>
                        <option value="holiday" data-i18n="eventTypeHoliday">Holiday / no class</option>
                        <option value="evaluation_deadline" data-i18n="eventTypeEvalDeadline">Evaluation deadline</option>
                        <option value="homework_deadline" data-i18n="eventTypeHomeworkDeadline">Homework deadline</option>
                        <option value="evaluation_period" data-i18n="eventTypeEvalPeriod">Evaluation period</option>
                        <option value="other" data-i18n="eventTypeOther">Other</option>
                    </select>
                    <p id="eventTypeHint" class="section-hint event-type-hint">Shown on the calendar for reference only; does not cancel class.</p>
                </div>

                <div class="form-group event-applies-group">
                    <label id="eventAppliesToLabel" data-i18n="appliesTo">Applies To</label>
                    <div id="eventAppliesScope" class="calendar-view-switch fh-scope" role="radiogroup" aria-labelledby="eventAppliesToLabel">
                        <button type="button" class="syllabus-segment-btn is-active" role="radio" aria-checked="true" data-applies-scope="all" data-i18n="eventAppliesScopeAll">Whole school</button>
                        <button type="button" class="syllabus-segment-btn" role="radio" aria-checked="false" data-applies-scope="groups" data-i18n="eventAppliesScopeGroups">Groups</button>
                        <button type="button" class="syllabus-segment-btn" role="radio" aria-checked="false" data-applies-scope="classes" data-i18n="eventAppliesScopeClasses">Specific classes</button>
                    </div>
                    <input type="checkbox" id="holidayAllClasses" checked hidden>
                    <div id="eventApplicabilityFilterRow" class="event-applicability-filter-row" hidden>
                        <button type="button" id="eventApplicabilityFilterBtn" class="btn btn-outline btn-small lesson-filter-btn" aria-expanded="false" aria-controls="eventApplicabilityPopover" data-i18n="eventApplicabilityFilterBtn">Choose…</button>
                    </div>
                    <p id="eventApplicabilitySummary" class="event-applicability-summary" role="status" hidden></p>
                </div>

                <div id="eventExceptGroup" class="form-group event-except-group">
                    <label id="eventExceptLabel" data-i18n="eventExceptLabel">Except</label>
                    <p class="section-hint" data-i18n="eventExceptHint">Classes listed here keep their normal lessons.</p>
                    <div id="eventExceptChips" class="fh-except-row" aria-labelledby="eventExceptLabel"></div>
                    <div class="event-applicability-filter-row">
                        <button type="button" id="eventExceptAddBtn" class="btn btn-outline btn-small" aria-expanded="false" aria-controls="eventApplicabilityPopover" data-i18n="eventExceptAddBtn">Add exceptions…</button>
                    </div>
                </div>

                <div class="form-group form-group--full-only">
                    <label for="eventNotes" data-i18n="notes">Notes</label>
                    <textarea id="eventNotes" rows="2" data-i18n-placeholder="eventNotesPlaceholder" placeholder="Optional notes..."></textarea>
                </div>

                <div class="form-actions event-form-actions editor-footer-actions--tab-only">
                    <button type="button" id="deleteHolidayBtnFooter" class="btn btn-danger" style="display: none;" data-i18n="delete">Delete</button>
                </div>
                </div>
            </form>
